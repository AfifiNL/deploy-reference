[project]
name = "deploy-reference"
version = "0.1.0"
description = "Reference deployment for a Python web service: a Helm chart with OpenTelemetry, autoscaling and a tested rollback on a local kind cluster, plus validated Terraform for EKS."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hossam Afifi" }]
dependencies = []

[project.urls]
Repository = "https://github.com/AfifiNL/deploy-reference"

[project.scripts]
deploy-reference = "deploy_reference.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deploy_reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# The end-to-end runner drives kind, kubectl, helm and docker from PATH with fixed arguments.
"src/deploy_reference/e2e.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["deploy_reference"]
mypy_path = "src"
